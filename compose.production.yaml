services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${DB_NAME:-railops}
      POSTGRES_USER: ${DB_USER:-railops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-railops} -d ${DB_NAME:-railops}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  release:
    image: ${RAILOPS_IMAGE:-railops:production}
    build:
      context: .
      dockerfile: Dockerfile
    environment: &app-environment
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DB_NAME: ${DB_NAME:-railops}
      DB_USER: ${DB_USER:-railops}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_HOST: db
      DB_PORT: "5432"
      MEDIA_ROOT: /app/media
      STATIC_ROOT: /app/staticfiles
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "scripts/release.py"]
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    restart: "no"

  app:
    image: ${RAILOPS_IMAGE:-railops:production}
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      release:
        condition: service_completed_successfully
    command:
      [
        "gunicorn",
        "--config",
        "config/gunicorn.conf.py",
        "config.wsgi:application",
      ]
    volumes:
      - staticfiles:/app/staticfiles:ro
      - media:/app/media
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  nginx:
    image: nginx:1.28.0-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${NGINX_PUBLISH_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
    restart: unless-stopped

volumes:
  postgis_data:
  staticfiles:
  media:
