{% if page.has_other_pages %}
  <nav aria-label="Pagination">
    <ul class="pagination">
      {% if page.has_previous %}
        <li class="page-item">
          <a class="page-link" href="?{% if search %}q={{ search|urlencode }}&{% endif %}page={{ page.previous_page_number }}">Previous</a>
        </li>
      {% else %}
        <li class="page-item disabled"><span class="page-link">Previous</span></li>
      {% endif %}
      <li class="page-item disabled">
        <span class="page-link">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
      </li>
      {% if page.has_next %}
        <li class="page-item">
          <a class="page-link" href="?{% if search %}q={{ search|urlencode }}&{% endif %}page={{ page.next_page_number }}">Next</a>
        </li>
      {% else %}
        <li class="page-item disabled"><span class="page-link">Next</span></li>
      {% endif %}
    </ul>
  </nav>
{% endif %}
