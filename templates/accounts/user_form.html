{% extends "base.html" %}
{% block title %}{{ title }} — RailOps{% endblock %}
{% block content %}
  <h1 class="h3 mb-3">{{ title }}</h1>
  <form method="post" novalidate class="card card-body shadow-sm" style="max-width: 36rem;">
    {% csrf_token %}
    {% include "components/form.html" %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Save</button>
      <a class="btn btn-outline-secondary" href="{% url 'user_list' %}">Cancel</a>
    </div>
  </form>
{% endblock %}
