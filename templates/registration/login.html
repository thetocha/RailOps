{% extends "base.html" %}
{% block title %}Log in — RailOps{% endblock %}
{% block content %}
  <div class="card shadow-sm railops-auth-card mx-auto">
    <div class="card-body p-4">
      <h1 class="h4 mb-3">Log in</h1>
      <p class="text-muted">Internal railway operations. Use your RailOps account.</p>
      <form method="post" action="{% url 'login' %}" novalidate>
        {% csrf_token %}
        {% include "components/form.html" %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button type="submit" class="btn btn-primary w-100">Log in</button>
      </form>
      <p class="mt-3 mb-0">
        <a href="{% url 'password_reset' %}">Forgot password?</a>
      </p>
    </div>
  </div>
{% endblock %}
