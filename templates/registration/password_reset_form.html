{% extends "base.html" %}
{% block title %}Reset password — RailOps{% endblock %}
{% block content %}
  <div class="card shadow-sm railops-auth-card mx-auto">
    <div class="card-body p-4">
      <h1 class="h4 mb-3">Reset password</h1>
      <p>Enter your email address. If an account exists, we will send reset instructions.</p>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "components/form.html" %}
        <button type="submit" class="btn btn-primary w-100">Send reset email</button>
      </form>
      <p class="mt-3 mb-0"><a href="{% url 'login' %}">Back to log in</a></p>
    </div>
  </div>
{% endblock %}
