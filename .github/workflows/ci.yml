name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: test-insecure-secret-key-for-automated-tests-only
      DB_NAME: railops
      DB_USER: railops
      DB_PASSWORD: railops
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_TEST_NAME: test_railops
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: railops
          POSTGRES_USER: railops
          POSTGRES_PASSWORD: railops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U railops -d railops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install GDAL and GEOS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            gdal-bin \
            libgdal-dev \
            libgeos-dev \
            libproj-dev

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      - name: Bandit
        run: uv run bandit -r apps config scripts -x tests,apps/accounts/tests

      - name: pip-audit
        run: uv run pip-audit

      - name: Django system checks
        run: uv run python manage.py check

      - name: Tests
        run: uv run pytest
